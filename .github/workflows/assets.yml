name: assets

on:
  push:
    paths: ["scripts/**", "assets/**"]
  pull_request:
    paths: ["scripts/**", "assets/**"]

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the SVGs
        run: |
          python scripts/blackhole.py
          python scripts/constellation.py
      - name: Fail if they differ from the committed ones
        run: git diff --exit-code -- assets
